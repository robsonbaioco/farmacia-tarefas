<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FarmaTarefas</title>
  <meta name="description" content="Lista de tarefas para trabalhadores de farmácia">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FarmaTarefas">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div>
        <strong>FarmaTarefas</strong>
        <span id="greeting" class="muted"></span>
      </div>
    </div>
    <button id="installBtn" class="btn btn-ghost" hidden>Instalar app</button>
  </header>

  <nav class="tabs" aria-label="Seções">
    <button class="tab" data-view="day" aria-current="page"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Dia</span></button>
    <button class="tab" data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Semana</span></button>
    <button class="tab" data-view="templates"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Modelos</span></button>
    <button class="tab" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Perfil</span></button>
  </nav>

  <main id="app"></main>

  <button id="fab" class="fab" aria-label="Nova tarefa"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <!-- Tarefa -->
  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h2 id="taskDialogTitle">Nova tarefa</h2>
      <label>Tarefa<input name="title" required maxlength="120" placeholder="Ex.: Conferir temperatura da geladeira"></label>
      <label>Observações<textarea name="notes" rows="2" maxlength="500" placeholder="Opcional"></textarea></label>
      <div class="row">
        <label>Dia<input type="date" name="date" required></label>
        <label>Momento do turno<select name="moment">
          <option value="inicio">Início do turno</option>
          <option value="" selected>Durante o turno</option>
          <option value="fim">Fim do turno</option>
        </select></label>
      </div>
      <div class="row">
        <label>Categoria<select name="category"></select></label>
        <label>Prioridade<select name="priority">
          <option value="baixa">Baixa</option>
          <option value="normal" selected>Normal</option>
          <option value="alta">Alta</option>
        </select></label>
      </div>
      <label class="check" id="saveAsTplWrap"><input type="checkbox" name="saveAsTemplate"> Salvar também como modelo</label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-danger" id="deleteTaskBtn" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Mover -->
  <dialog id="moveDialog">
    <form method="dialog" id="moveForm">
      <h2>Mover tarefa</h2>
      <p class="muted" id="moveTaskName"></p>
      <div class="chips" id="moveChips"></div>
      <label>Ou escolha o dia<input type="date" name="date" required></label>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Mover</button>
      </div>
    </form>
  </dialog>

  <!-- Modelo -->
  <dialog id="tplDialog">
    <form method="dialog" id="tplForm">
      <h2 id="tplDialogTitle">Novo modelo</h2>
      <label>Tarefa<input name="title" required maxlength="120"></label>
      <label>Observações<textarea name="notes" rows="2" maxlength="500"></textarea></label>
      <div class="row">
        <label>Momento do turno<select name="moment">
          <option value="inicio">Início do turno</option>
          <option value="" selected>Durante o turno</option>
          <option value="fim">Fim do turno</option>
        </select></label>
        <label>Categoria<select name="category"></select></label>
      </div>
      <div class="row">
        <label>Prioridade<select name="priority">
          <option value="baixa">Baixa</option>
          <option value="normal" selected>Normal</option>
          <option value="alta">Alta</option>
        </select></label>
        <label class="check check-inline"><input type="checkbox" name="routine"> Faz parte da rotina diária</label>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmação genérica -->
  <dialog id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText" class="muted"></p>
      <div class="dialog-actions" id="confirmActions"></div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
